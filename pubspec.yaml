name: spinfolk
description: "Offline single-phone Truth-or-Dare party game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  flutter_bloc: 9.1.1
  get_it: 9.3.0
  injectable: 3.0.0
  go_router: 18.1.4
  sqflite: 2.4.6
  shared_preferences: 2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  injectable_generator: 3.1.3
  build_runner: 2.16.1
  sqflite_common_ffi: 2.4.7

flutter:
  uses-material-design: true
