# SE-size / large-text screenshots. Build with SPINFOLK_INITIAL_COUNT=2 so both
# roles are always named (long-name layout guaranteed).
# Run: maestro test -e TAG=<size> -e TYPE=yes|no tool/maestro/screens.yaml
appId: in.appamania.spinfolk
---
- launchApp
- assertVisible: "Spinfolk"
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-home
- tapOn: "New game"
- assertVisible: "New game"
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-new-game
- swipe: { start: "2%, 70%", end: "2%, 10%" }
- swipe: { start: "2%, 70%", end: "2%, 10%" }
- tapOn: "Add names.*"
- runFlow:
    when:
      true: ${TYPE == 'yes'}
    commands:
      - scrollUntilVisible: { element: "Name for player 1.*|Player 1" }
      - tapOn: "Name for player 1.*|Player 1"
      - inputText: "Abcdefghijklmnopqrstuvwxyz0123456789ABCD"
      - scrollUntilVisible: { element: "Name for player 2.*|Player 2" }
      - tapOn: "Name for player 2.*|Player 2"
      - inputText: "Wxyzabcdefghijklmnopqrstuvwxyz0123456789"
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-names
- tapOn: "Done"
- tapOn: "Start session"
- assertVisible: "Round 1 · 2 players"
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-ready
- tapOn: "Spin"
- extendedWaitUntil: { visible: "Taker .*", timeout: 15000 }
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-revealed
- tapOn: "Truth"
- assertVisible: "Next Round"
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-challenge
- tapOn: "Session and settings"
- extendedWaitUntil: { visible: "VOICE", timeout: 5000 }
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-sheet
- scrollUntilVisible: { element: "End Session" }
- tapOn: "End Session"
- extendedWaitUntil: { visible: "End this session?", timeout: 5000 }
- waitForAnimationToEnd
- takeScreenshot: docs/plans/phase-5/evidence/p2b-se-${TAG}-end
- tapOn: "Cancel"
- assertVisible: "Round 1 · 2 players"
